# CodeQL configuration for Sedna.UI.
#
# The query packs are named in codeql.yml, next to the comment explaining why
# `extended` is the right trade for a public endpoint. This file exists for the
# exclusions, because an exclusion has to be reviewable: a query dismissed in the
# web UI leaves no trace in the repository, and the next person cannot tell a
# considered decision from an unread alert.

query-filters:
  # `cs/path-combine` warns that Path.Combine silently drops its earlier
  # arguments when a later one is an absolute path. Every call in this repository
  # joins a discovered repository root to constant relative segments — "src",
  # "wwwroot", a file name — so no argument can ever be absolute, and the query
  # has no way to prove that. It reported 69 alerts, all of them in the guard
  # tests that locate the shipped assets on disk.
  #
  # Reinstate this query the day a path segment comes from outside the repository.
  - exclude:
      id: cs/path-combine

  # `cs/linq/missed-where` fires on any foreach whose body opens with a guard that
  # `continue`s. Most of them here guard on a `TryGetValue`/`TryGetProperty` that
  # also produces the value the body needs, and a `.Where(...)` predicate cannot
  # carry an `out` parameter out to the loop body — so the rewrite the query asks
  # for looks the value up twice. The query has no way to see that: it reads the
  # `continue` and stops.
  #
  # Reinstate this query the day the analyser can see through `out`.
  - exclude:
      id: cs/linq/missed-where

  # `cs/linq/missed-select` fires on any foreach whose first statement assigns from
  # the iteration variable. That assignment is what lets the rest of the body name
  # the thing — in an assertion message, or in the comment explaining the predicate
  # underneath it — and `.Select(...)` moves the name off the lines that explain it.
  # In a guard test the failure message is the point of the guard.
  #
  # Both LINQ queries were already being dismissed site by site in the web UI, which
  # is the practice the header of this file argues against. These two exclusions
  # replace those dismissals.
  - exclude:
      id: cs/linq/missed-select
