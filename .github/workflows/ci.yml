name: CI

# Pull requests only, and a smoke pass: the generated files, the build, every test
# that needs no browser, the package and the catalogue image. A pull request is
# tested in full locally before it is opened; the whole suite, in every engine, runs
# on the release tag before anything publishes (release.yml). The ruleset on main
# requires `build` on a branch that is up to date with main, so keep the job's name.
# CodeQL still runs on main: it is the baseline pull requests are compared against.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, not just history: class-history.sh derives which release first
          # shipped each class from `git tag`, and the default shallow checkout
          # fetches none — so the check has nothing to compare against.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The generated artefacts, checked before the build so a stale one is reported as
      # itself rather than as a confusing test failure. Each --check regenerates nothing
      # and fails if the committed file disagrees with the source it comes from.
      - name: Check the generated files are up to date
        run: |
          bash build/bundle-css.sh --check
          bash build/bundle-js.sh --check
          bash build/export-tokens.sh --check
          bash build/class-states.sh --check
          bash build/app-tooling.sh --check

      # Not committed: it is dated by the tags, so it is generated wherever it is built.
      - name: Generate the class history
        run: bash build/class-history.sh

      - name: Restore
        run: dotnet restore Sedna.UI.slnx

      - name: Build
        run: dotnet build Sedna.UI.slnx -c Release --no-restore

      # The source scans (no hard-coded colours outside the :root blocks, every
      # catalogue page linked and reachable), the bUnit component tests (the markup
      # tier 1 emits is a version contract) and the catalogue's server-side tests.
      # SEDNA_UI_BROWSER_TESTS=0 is the documented opt-out: the browser tests return
      # without asserting, and the release tag runs them in every engine.
      - name: Test (smoke, no browser)
        env:
          SEDNA_UI_BROWSER_TESTS: '0'
        run: dotnet test Sedna.UI.slnx -c Release --no-build --verbosity normal

      # Packing on every build, not just on a tag: a packaging mistake should
      # fail the PR that introduced it, not the release three weeks later.
      - name: Pack
        run: dotnet pack src/Sedna.UI/Sedna.UI.csproj -c Release --no-build -o artifacts

      # Invoked through bash so it does not depend on the executable bit, which git
      # on Windows generally does not record. The script refuses more than one
      # argument rather than silently checking whichever came first.
      - name: Verify package contents
        run: bash build/verify-package.sh artifacts/Sedna.UI.[0-9]*.nupkg

      # Build only, never push. A Dockerfile that no longer restores should fail the
      # pull request that broke it, not surface as a red deploy on main afterwards —
      # the same argument this workflow already makes for packing on every build.
      # Railway builds the image it actually deploys, from the GitHub source.
      - name: Build the catalogue image
        run: docker build -f src/Sedna.UI.Catalogue/Dockerfile -t sedna-ui-catalogue:ci .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
