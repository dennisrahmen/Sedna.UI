name: CI

# Pull requests. `build` is the quick pass: the generated files, the build, every test
# that needs no browser, the package and the catalogue image. `tests` is the full suite on
# Linux, in every engine (tests.yml). `ready` is the one check the ruleset on main
# requires: it succeeds only when everything that had to run succeeded.
# A change of prose alone does not start the browser suite, and `ready` is still green: the
# decision is made here, by `changes`, not by a path filter on the trigger, because a
# required check that never starts blocks the merge.
# CodeQL still runs on main: it is the baseline pull requests are compared against.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change touches anything but prose. Prose is a Markdown file outside
  # docs/design-guide/ (the design guide's entries are stamped against the pages they
  # describe), the licence and the issue templates.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # On a pull request the checkout is the merge of the branch into its base, so the
      # first parent is the base and one more commit of history is all the diff needs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [[ "$EVENT" == 'pull_request' ]] && files="$(git diff --name-only HEAD^1 HEAD)" && [[ -n "$files" ]]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                docs/design-guide/*) code=true ;;
                *.md | LICENSE | .github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Browser suite needed: $code"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, not just history: class-history.sh derives which release first
          # shipped each class from `git tag`, and the default shallow checkout
          # fetches none — so the check has nothing to compare against.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The generated artefacts, checked before the build so a stale one is reported as
      # itself rather than as a confusing test failure. Each --check regenerates nothing
      # and fails if the committed file disagrees with the source it comes from.
      - name: Check the generated files are up to date
        run: |
          bash build/bundle-css.sh --check
          bash build/bundle-js.sh --check
          bash build/export-tokens.sh --check
          bash build/class-states.sh --check
          bash build/app-tooling.sh --check
          bash build/guide-stamp.sh --check

      # Not committed: it is dated by the tags, so it is generated wherever it is built.
      - name: Generate the class history
        run: bash build/class-history.sh

      - name: Restore
        run: dotnet restore Sedna.UI.slnx

      - name: Build
        run: dotnet build Sedna.UI.slnx -c Release --no-restore

      # The source scans (no hard-coded colours outside the :root blocks, every
      # catalogue page linked and reachable), the bUnit component tests (the markup
      # tier 1 emits is a version contract) and the catalogue's server-side tests, fast.
      # SEDNA_UI_BROWSER_TESTS=0 is the documented opt-out: the browser tests return
      # without asserting here, and `tests` runs them in every engine.
      - name: Test (no browser)
        env:
          SEDNA_UI_BROWSER_TESTS: '0'
        run: dotnet test Sedna.UI.slnx -c Release --no-build --verbosity normal

      # Packing on every build, not just on a tag: a packaging mistake should
      # fail the PR that introduced it, not the release three weeks later.
      - name: Pack
        run: dotnet pack src/Sedna.UI/Sedna.UI.csproj -c Release --no-build -o artifacts

      # Invoked through bash so it does not depend on the executable bit, which git
      # on Windows generally does not record. The script refuses more than one
      # argument rather than silently checking whichever came first.
      - name: Verify package contents
        run: bash build/verify-package.sh artifacts/Sedna.UI.[0-9]*.nupkg

      # Build only, never push. A Dockerfile that no longer restores should fail the
      # pull request that broke it, not surface as a red deploy on main afterwards —
      # the same argument this workflow already makes for packing on every build.
      # Railway builds the image it actually deploys, from the GitHub source.
      - name: Build the catalogue image
        run: docker build -f src/Sedna.UI.Catalogue/Dockerfile -t sedna-ui-catalogue:ci .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      site: true

  # The one name the ruleset requires. It runs whatever happened before it and
  # succeeds only when the quick pass succeeded and the suite either succeeded or had
  # nothing to test (a change of prose alone).
  ready:
    needs: [changes, build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Everything that had to run succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.tests.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES build=$BUILD tests=$TESTS code=$CODE"
          [[ "$CHANGES" == 'success' && "$BUILD" == 'success' ]] || exit 1
          [[ "$TESTS" == 'success' || ( "$TESTS" == 'skipped' && "$CODE" == 'false' ) ]] || exit 1
