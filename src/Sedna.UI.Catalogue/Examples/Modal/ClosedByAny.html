<!-- closedby="any": a click on the backdrop closes it, as Escape does, on a modal, a drawer,
     a sheet or a lightbox. On a dialog that holds unsaved work add data-close-guard as well:
     the click then raises cancel instead of closing, and your handler decides. -->
<dialog id="shortcuts" class="modal" closedby="any" aria-labelledby="shortcuts-title">
    <div class="modal-header">
        <h3 id="shortcuts-title">Keyboard shortcuts</h3>
        <form method="dialog"><button class="modal-close" aria-label="Close"><i class="ri-close-line"></i></button></form>
    </div>
    <div class="modal-body">
        <p><kbd>Ctrl</kbd> <kbd>K</kbd> opens the command palette.</p>
    </div>
</dialog>
