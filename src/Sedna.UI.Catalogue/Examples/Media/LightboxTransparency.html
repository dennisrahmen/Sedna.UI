<dialog class="lightbox" id="lb-logo" aria-labelledby="lb-logo-title">
    <div class="lightbox-head">
        <strong class="lightbox-title" id="lb-logo-title">logo-mark.svg</strong>
        <div class="lightbox-actions">
            <form method="dialog"><button class="btn btn--ghost btn--icon" aria-label="Close"><i class="ri-close-line"></i></button></form>
        </div>
    </div>
    <div class="lightbox-stage lightbox-stage--transparency">
        <svg width="480" height="270" viewBox="0 0 160 90" role="img" aria-label="The logo mark on a transparent background">
            <circle cx="45" cy="45" r="28" fill="currentColor" style="color: var(--brand)" />
            <rect x="84" y="31" width="52" height="28" rx="6" fill="currentColor" style="color: var(--info-fg)" />
        </svg>
    </div>
</dialog>
