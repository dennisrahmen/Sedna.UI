<svg xmlns="http://www.w3.org/2000/svg" class="sedna-sprite" aria-hidden="true" focusable="false">
<!--
  Sedna.UI — state illustrations.

  One <symbol> per state, written into the page by SednaStateArt and referenced from
  markup by id. The markup, the sizes, the accents, the motion and the reasoning are
  in css‑parts/42‑state‑art.css; this file is the drawings.

  Note for anyone editing here: an XML comment may not contain two hyphens in a row,
  so CSS custom properties and BEM modifiers cannot be written out in this block. They
  are named in the stylesheet instead.

  Rules this file keeps, all of them for a reason:

  · Every drawing sits on the same 120‑unit grid as the brand marks, with a 3‑unit
    stroke, round caps and round joins. That is what makes thirteen scenes read as one
    set rather than thirteen pieces of clip art.
  · NO COLOUR AND NO STYLE IS WRITTEN HERE. Every part carries one of the sprite
    classes the stylesheet declares: line, soft, dash, accent, tint and knockout. Line
    work is currentColor and the accent is the state‑accent custom property, so the
    drawing follows the theme, the surface it sits on and the state it is in with
    nothing to keep in step, and an app's own sprite draws with the same classes.
  · One accent per scene, on the part that says what happened — the magnifier, the
    lock, the crack. Two accents and the eye has nowhere to land.
  · Motion is a class on the part that moves, and it is paused until the page says
    otherwise. Every animation's first frame is the resting pose, so a paused drawing
    is the still drawing.
  · Nothing smaller than a 3‑unit stroke or a 6‑unit gap, because the smallest size
    renders this at 56px and detail below that fills in and reads as noise. Same reason
    the brand mark is drawn three times rather than scaled.
-->

<!-- ── Nothing yet ── an empty tray, with the first item still on its way in. -->
<symbol id="nothing-yet" viewBox="0 0 120 120">
  <g class="sedna-art-bob">
    <rect class="sedna-art-accent sedna-art-dash" x="40" y="16" width="40" height="28" rx="5" />
    <path class="sedna-art-accent" d="M60 52v10m-6-6 6 6 6-6" />
  </g>
  <path class="sedna-art-tint" d="M24 74h20l5 9h22l5-9h20v18a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6z" />
  <path class="sedna-art-line" d="M24 74v18a6 6 0 0 0 6 6h60a6 6 0 0 0 6-6V74" />
  <path class="sedna-art-line" d="M24 74h20l5 9h22l5-9h20" />
</symbol>

<!-- ── Nothing found ── a list that is there, searched, and has no match in it. -->
<symbol id="no-results" viewBox="0 0 120 120">
  <path class="sedna-art-soft" d="M22 34h56M22 50h40M22 66h26" />
  <g class="sedna-art-sweep">
    <circle class="sedna-art-accent" cx="74" cy="70" r="20" />
    <path class="sedna-art-accent" d="m89 85 12 12" />
  </g>
</symbol>

<!-- ── Filtered to nothing ── the funnel is full and nothing came out of it. -->
<symbol id="filtered-out" viewBox="0 0 120 120">
  <path class="sedna-art-tint" d="M22 24h76L68 60v26l-16 10V60z" />
  <path class="sedna-art-accent" d="M22 24h76L68 60v26l-16 10V60z" />
  <path class="sedna-art-soft sedna-art-dash" d="M38 108h44" />
</symbol>

<!-- ── No access ── the content is there and readable, and it is shut. -->
<symbol id="no-access" viewBox="0 0 120 120">
  <rect class="sedna-art-tint" x="20" y="20" width="80" height="66" rx="6" />
  <rect class="sedna-art-soft" x="20" y="20" width="80" height="66" rx="6" />
  <path class="sedna-art-soft" d="M32 38h34M32 52h22" />
  <rect class="sedna-art-knockout" x="38" y="70" width="44" height="36" rx="8" />
  <path class="sedna-art-accent" d="M50 74v-9a10 10 0 0 1 20 0v9" />
  <rect class="sedna-art-accent" x="42" y="74" width="36" height="28" rx="6" />
  <path class="sedna-art-accent" d="M60 84v8" />
</symbol>

<!-- ── Failed to load ── the panel arrived torn. Not "empty" and not "offline". -->
<symbol id="failed" viewBox="0 0 120 120">
  <rect class="sedna-art-tint" x="20" y="24" width="80" height="72" rx="6" />
  <path class="sedna-art-soft" d="M46 24H26a6 6 0 0 0-6 6v60a6 6 0 0 0 6 6h20M74 24h20a6 6 0 0 1 6 6v60a6 6 0 0 1-6 6H74" />
  <path class="sedna-art-accent" d="M58 24l-8 22 16 12-14 14 12 10-6 14" />
</symbol>

<!-- ── Waiting ── work accepted and queued. For a wait with nothing to report use the
     spinner instead: this is the static case, where the queue itself is the answer. -->
<symbol id="waiting" viewBox="0 0 120 120">
  <path class="sedna-art-line" d="M18 88h84" />
  <rect class="sedna-art-tint" x="22" y="52" width="26" height="26" rx="4" />
  <rect class="sedna-art-soft" x="22" y="52" width="26" height="26" rx="4" />
  <rect class="sedna-art-tint" x="56" y="52" width="26" height="26" rx="4" />
  <rect class="sedna-art-soft" x="56" y="52" width="26" height="26" rx="4" />
  <rect class="sedna-art-accent sedna-art-dash" x="90" y="52" width="26" height="26" rx="4" />
  <g class="sedna-art-nudge">
    <path class="sedna-art-accent" d="M60 32h18m0 0-6-6m6 6-6 6" />
  </g>
</symbol>

<!-- ── Not found ── the signpost is standing and the way it pointed is blank. -->
<symbol id="not-found" viewBox="0 0 120 120">
  <path class="sedna-art-line" d="M60 26v76M42 102h36" />
  <path class="sedna-art-soft" d="M60 34h26l8 10-8 10H60" />
  <path class="sedna-art-accent sedna-art-dash" d="M60 66H34l-8 10 8 10h26" />
</symbol>

<!-- ── Server error ── the request reached a machine and the machine is the problem. -->
<symbol id="server-error" viewBox="0 0 120 120">
  <rect class="sedna-art-soft" x="22" y="20" width="76" height="24" rx="5" />
  <path class="sedna-art-soft" d="M34 32h.01M46 32h.01" />
  <rect class="sedna-art-tint" x="22" y="52" width="76" height="24" rx="5" />
  <rect class="sedna-art-knockout" x="30" y="56" width="60" height="16" rx="3" />
  <rect class="sedna-art-accent" x="22" y="52" width="76" height="24" rx="5" />
  <path class="sedna-art-accent sedna-art-blink" d="M60 58v6m0 6h.01" />
  <rect class="sedna-art-soft" x="22" y="84" width="76" height="24" rx="5" />
  <path class="sedna-art-soft" d="M34 96h.01M46 96h.01" />
</symbol>

<!-- ── Session expired ── the pass, and the clock that ran out on it. Not the padlock
     of no-access: nothing here is forbidden, the pass just stopped being valid. -->
<symbol id="session-expired" viewBox="0 0 120 120">
  <path class="sedna-art-soft" d="M44 22v-6h16v6" />
  <rect class="sedna-art-tint" x="22" y="22" width="60" height="74" rx="7" />
  <rect class="sedna-art-soft" x="22" y="22" width="60" height="74" rx="7" />
  <circle class="sedna-art-soft" cx="52" cy="48" r="12" />
  <path class="sedna-art-soft" d="M34 72h36M34 84h22" />
  <circle class="sedna-art-knockout" cx="88" cy="80" r="26" />
  <circle class="sedna-art-accent" cx="88" cy="80" r="20" />
  <path class="sedna-art-accent sedna-art-tick" d="M88 68v12l9 6" />
</symbol>

<!-- ── Maintenance ── the thing is there and barricaded. A barrier says planned and
     says it comes back; a spanner says somebody is elbow-deep in it and might not. -->
<symbol id="maintenance" viewBox="0 0 120 120">
  <rect class="sedna-art-tint" x="22" y="24" width="76" height="72" rx="6" />
  <rect class="sedna-art-soft" x="22" y="24" width="76" height="72" rx="6" />
  <path class="sedna-art-soft" d="M34 40h36M34 84h50" />
  <rect class="sedna-art-knockout" x="10" y="48" width="100" height="24" rx="5" />
  <rect class="sedna-art-accent" x="10" y="48" width="100" height="24" rx="5" />
  <path class="sedna-art-accent" d="M34 72l14-24M54 72l14-24M74 72l14-24" />
</symbol>

<!-- ── Nothing left to do ── a cleared queue, which must not read like a broken one. -->
<symbol id="all-done" viewBox="0 0 120 120">
  <rect class="sedna-art-soft" x="20" y="24" width="20" height="20" rx="5" />
  <path class="sedna-art-soft" d="M52 34h46M26 34l4 5 6-8" />
  <rect class="sedna-art-soft" x="20" y="52" width="20" height="20" rx="5" />
  <path class="sedna-art-soft" d="M52 62h34M26 62l4 5 6-8" />
  <rect class="sedna-art-tint" x="20" y="80" width="20" height="20" rx="5" />
  <rect class="sedna-art-accent" x="20" y="80" width="20" height="20" rx="5" />
  <path class="sedna-art-accent" d="M52 90h42M26 90l4 5 6-8" />
</symbol>

<!-- ── First run ── the box is open and nothing has been taken out of it yet. -->
<symbol id="first-run" viewBox="0 0 120 120">
  <path class="sedna-art-tint" d="M28 62h64v30a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6z" />
  <path class="sedna-art-line" d="M28 62v30a6 6 0 0 0 6 6h52a6 6 0 0 0 6-6V62" />
  <path class="sedna-art-line" d="M28 62l14-14h36l14 14M60 48v50" />
  <path class="sedna-art-accent sedna-art-twinkle" d="M60 12v12M40 22l6 8M80 22l-6 8" />
</symbol>

<!-- ── Connection lost ── the request never left. Distinct from "failed": nothing
     came back wrong, because nothing went. -->
<symbol id="offline" viewBox="0 0 120 120">
  <path class="sedna-art-tint" d="M14 48a8 8 0 0 1 8-8h26v40H22a8 8 0 0 1-8-8z" />
  <rect class="sedna-art-line" x="14" y="40" width="34" height="40" rx="8" />
  <path class="sedna-art-line" d="M48 50h6M48 70h6" />
  <path class="sedna-art-soft" d="M14 60H4" />
  <path class="sedna-art-tint" d="M72 40h26a8 8 0 0 1 8 8v24a8 8 0 0 1-8 8H72z" />
  <rect class="sedna-art-line" x="72" y="40" width="34" height="40" rx="8" />
  <path class="sedna-art-line" d="M72 50h-6M72 70h-6" />
  <path class="sedna-art-soft" d="M106 60h10" />
  <path class="sedna-art-accent sedna-art-blink" d="M60 28v10M60 82v10M47 33l5 8M73 33l-5 8" />
</symbol>

</svg>
