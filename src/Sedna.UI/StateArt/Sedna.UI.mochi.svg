<svg xmlns="http://www.w3.org/2000/svg" class="sedna-sprite" aria-hidden="true" focusable="false">
<!--
  Sedna.UI — Mochi, the agent's character.

  One rigged drawing on a 160 unit grid, written into the page by SednaMochi and
  referenced from markup as a use of sedna-mochi. The character, its shapes and its
  clay shading come from the Mochi design system; the rig, the actions, the moods,
  the tones and the perches are in css‑parts/68‑mochi.css.

  An XML comment may not contain two hyphens in a row, so no custom property and no
  modifier is written out here. They are named in the stylesheet instead.

  Rules this file keeps:

  · NO COLOUR AND NO STYLE IS WRITTEN HERE. Every coloured part carries a class the
    stylesheet declares, and the gradients and the clay filter read theirs through
    classes on their stops and floods. The only attributes that are not geometry
    point at this file's own paint servers and filters.
  · A JOINT IS A GROUP. An arm is a group turned at the shoulder, holding a segment
    and a group that reaches along it to the hand; a leg turns at the hip and its foot
    turns back; a shin swings at the knee. The stylesheet moves the groups and never
    the shapes inside them, so every pose is the same drawing.
  · The lines a perch places are fixed: the seat at y 120, the peeking edge at y 104,
    the feet at y 154, the hanging grip at y 30, the side edge at x 60. Moving any of
    them moves where Mochi meets a card.
-->
  <defs>
    <radialGradient id="sedna-mochi-sheen" cx="38%" cy="30%" r="85%"><stop offset="0" class="sedna-mochi-sheen-hi"/><stop offset="0.58" class="sedna-mochi-sheen-mid"/><stop offset="1" class="sedna-mochi-sheen-lo"/></radialGradient>
    <radialGradient id="sedna-mochi-legs" cx="38%" cy="30%" r="85%"><stop offset="0" class="sedna-mochi-leg-hi"/><stop offset="0.6" class="sedna-mochi-leg-mid"/><stop offset="1" class="sedna-mochi-leg-lo"/></radialGradient>
    <filter id="sedna-mochi-clay" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="-6" dy="-8" result="up"/><feComposite in="SourceAlpha" in2="up" operator="out" result="rim"/>
      <feFlood class="sedna-mochi-shadow-flood" flood-opacity="0.3"/><feComposite in2="rim" operator="in" result="shade"/>
      <feOffset in="blur" dx="4.2" dy="5.6" result="down"/><feComposite in="SourceAlpha" in2="down" operator="out" result="lip"/>
      <feFlood class="sedna-mochi-light-flood" flood-opacity="0.4"/><feComposite in2="lip" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
    </filter>
    <filter id="sedna-mochi-clay-small" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blur"/>
      <feOffset in="blur" dx="-2.2" dy="-3" result="up"/><feComposite in="SourceAlpha" in2="up" operator="out" result="rim"/>
      <feFlood class="sedna-mochi-shadow-flood" flood-opacity="0.28"/><feComposite in2="rim" operator="in" result="shade"/>
      <feOffset in="blur" dx="1.54" dy="2.1" result="down"/><feComposite in="SourceAlpha" in2="down" operator="out" result="lip"/>
      <feFlood class="sedna-mochi-light-flood" flood-opacity="0.35"/><feComposite in2="lip" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
    </filter>
    <filter id="sedna-mochi-glow-filter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sedna-mochi-ao" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="sedna-mochi-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <symbol id="sedna-mochi" viewBox="0 0 160 160" overflow="visible">
